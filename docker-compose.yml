services:
  lis-client:
    build: .
    # Логин/пароль вводятся вручную в консоли при старте (LoginWorkers.kt требует System.console()) —
    # без stdin_open+tty он будет null и приложение сразу упадёт с ошибкой "Нет консоли".
    stdin_open: true
    tty: true
    volumes:
      # settings.json редактируется под конкретный запуск (URL Loodsman/ПОЛИНОМ, mapping) —
      # монтируется, а не собирается в образ.
      - ${SETTINGS_FILE:-./settings.json}:/data/settings.json:ro
      # Исходный Excel файл (объекты, связи).
      - ${EXCEL_FILE:-./data/data.xlsx}:/data/data.xlsx:ro
      # Отдельный Excel со списком сканов документов и их путями (опционально).
      - ${DOCUMENTS_EXCEL:-./data/documents.xlsx}:/data/documents.xlsx:ro
      # Папка с физическими сканами (PDF, JPG и т.д.) (опционально).
      - ${DOCUMENTS_FOLDER:-./documents}:/data/documents:ro
    environment:
      # settings.mapping.source.path в settings.json обычно содержит хостовый путь (для
      # локального запуска) — переопределяем его здесь на путь внутри контейнера, куда
      # смонтирован xlsx выше. См. MigrationEngine.excelInputStream().
      - LIS_EXCEL_PATH=/data/data.xlsx
